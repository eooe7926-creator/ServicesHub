<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Inner circular glow -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fed7aa" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Steam Curves -->
  <g stroke="#fef3c7" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 210 135 C 200 115 220 95 210 75" />
    <path d="M 256 125 C 246 100 266 80 256 60" />
    <path d="M 302 135 C 292 115 312 95 302 75" />
  </g>
  
  <!-- Koshary Hand Bowl -->
  <g filter="url(#shadow)">
    <!-- Main Bowl Base -->
    <path d="M 120 220 Q 120 360 256 360 Q 392 360 392 220 Z" fill="url(#bowlGrad)"/>
    
    <!-- Bowl Rim Rim -->
    <ellipse cx="256" cy="220" rx="136" ry="32" fill="#fffbeb" stroke="#f59e0b" stroke-width="6"/>
    
    <!-- Food Heap (Rice/Lentils/Pasta/Tekleya) -->
    <ellipse cx="256" cy="214" rx="120" ry="24" fill="#d97706"/>
    <ellipse cx="256" cy="208" rx="90" ry="18" fill="#b45309"/>
    
    <!-- Crispy Onions / Tekleya dots -->
    <circle cx="240" cy="204" r="6" fill="#fde68a"/>
    <circle cx="270" cy="206" r="5" fill="#fde68a"/>
    <circle cx="256" cy="202" r="7" fill="#fbbf24"/>
    <circle cx="225" cy="208" r="5" fill="#f59e0b"/>
    <circle cx="285" cy="208" r="6" fill="#fbbf24"/>
    <circle cx="245" cy="214" r="5" fill="#fbbf24"/>
    <circle cx="268" cy="213" r="5" fill="#fde68a"/>
    
    <!-- Bowl Base Foot -->
    <ellipse cx="256" cy="360" rx="60" ry="12" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  </g>
  
  <!-- Crossed Fork & Spoon / Hand emblem accent -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M 180 395 L 332 395" />
  </g>
  
  <!-- Arabic Calligraphy Text Style "كشري هاند" below -->
  <text x="256" y="445" font-family="'Cairo', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1">كشري هاند</text>
  <text x="256" y="475" font-family="sans-serif" font-weight="700" font-size="16" fill="#fed7aa" text-anchor="middle" letter-spacing="3">KOSHARY HAND</text>
</svg>
